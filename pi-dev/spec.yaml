schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI

args:
  llmapi_domain:
    required: true
    description: "LLM service API domain"

sandbox:
  image: docker.io/sbx/pi-image:latest
  entrypoint:
    - pi

permissions:
  network:
    allow:
      - "${{ kit.args.llmapi_domain }}"
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org

credentials:
  - service: llmapi
    apiKey:
      name: LLMAPI_API_KEY
      proxyManaged: true
      inject:
        # pi only sends x-api-key to api.anthropic.com; no other host needs
        # the key, so no other host gets it.
        - domain: "${{ kit.args.llmapi_domain }}"
          header: Authorization
          format: 'Bearer %s'

setup:
  install:
    # dev tools and skills
    - command: npx -y skills@latest add mattpocock/skills -g -y $(curl -s https://raw.githubusercontent.com/mattpocock/skills/main/.claude-plugin/plugin.json | jq -r '.skills[] | split("/") | last' | xargs -n1 printf -- '-s %s ')
      user: "1000"
      description: Install Matt Pocock Skills
    - command: npx -y skills@latest add https://github.com/only-cli/oc -g -y --skill web-browsing-cli
      user: "1000"
      description: Install OnlyCli Skill
    - command: npm install -g @playwright/cli@latest
      user: "1000"
      description: Install Playwright
    - command: playwright-cli install --skills agents --global
      user: "1000"
      description: Install Playwright Skills