schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI

args:
  llmapi_domain:
    required: true
    description: "LLM service API domain"

sandbox:
  image: docker.io/sbx/pi-image:latest
  entrypoint:
    - pi

permissions:
  network:
    allow:
      - "${{ kit.args.llmapi_domain }}"
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org

credentials:
  - service: llmapi
    apiKey:
      name: LLMAPI_API_KEY
      proxyManaged: true
      inject:
        # Inject the API key only on requests sent to the configured LLM API domain.
        - domain: "${{ kit.args.llmapi_domain }}"
          header: Authorization
          format: 'Bearer %s'

setup:
  install:
    # Dev tools and skills
    - command: npx -y skills@latest add mattpocock/skills -g -y $(curl -s https://raw.githubusercontent.com/mattpocock/skills/main/.claude-plugin/plugin.json | jq -r '.skills[] | split("/") | last' | xargs -n1 printf -- '-s %s ')
      user: "1000"
      description: Install Matt Pocock Skills
    - command: npx -y skills@latest add https://github.com/only-cli/oc -g -y --skill web-browsing-cli
      user: "1000"
      description: Install OnlyCli Skill
    - command: npm install -g @playwright/cli@latest
      user: "1000"
      description: Install Playwright
    - command: playwright-cli install --skills agents --global
      user: "1000"
      description: Install Playwright Skills

  startup:
    - command:
        - bash
        - -c
        - |
          # 1. Carica le variabili di proxy e CA dall'ambiente
          while IFS='=' read -r k v; do
            case "$k" in
              HTTP_PROXY|HTTPS_PROXY|NO_PROXY|PROXY_CA_CERT_B64) export "$k=$v" ;;
            esac
          done < <(env; tr '\0' '\n' < /proc/1/environ 2>/dev/null)

          # 2. Configura Docker CLI per instradare tutto nel proxy L7
          for d in /home/agent/.docker /root/.docker; do
            mkdir -p "$d"
            [ -f "$d/config.json" ] || echo '{}' > "$d/config.json"
            jq --arg hp "$HTTP_PROXY" --arg hsp "$HTTPS_PROXY" --arg np "$NO_PROXY" \
              '.proxies.default = {httpProxy: $hp, httpsProxy: $hsp, noProxy: $np}' \
              "$d/config.json" > "$d/config.json.tmp" && mv "$d/config.json.tmp" "$d/config.json"
          done
          chown -R 1000:1000 /home/agent/.docker

          # 3. Estrae la CA del proxy e crea il bundle universale di sistema
          CA_CERT="/etc/ssl/certs/sbx-proxy-ca.crt"
          CA_BUNDLE="/etc/ssl/certs/sbx-ca-bundle.crt"
          WGET_RC="/etc/ssl/certs/sbx-wgetrc"

          rm -f "$CA_CERT"
          if [ -n "$PROXY_CA_CERT_B64" ]; then
            printf '%s' "$PROXY_CA_CERT_B64" | base64 -d > "$CA_CERT" 2>/dev/null || true
          fi
          if [ ! -s "$CA_CERT" ] && compgen -G "/usr/local/share/ca-certificates/*.crt" > /dev/null; then
            cat /usr/local/share/ca-certificates/*.crt > "$CA_CERT"
          fi
          if [ ! -s "$CA_CERT" ] && [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            python3 -c '
          import re, subprocess
          data = open("/etc/ssl/certs/ca-certificates.crt").read()
          for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", data, re.S):
              out = subprocess.run(["openssl", "x509", "-noout", "-subject"], input=pem, text=True, capture_output=True).stdout
              if "Docker Sandboxes" in out:
                  open("/etc/ssl/certs/sbx-proxy-ca.crt", "w").write(pem + "\n")
                  break
          ' 2>/dev/null || true
          fi

          cat /etc/ssl/certs/ca-certificates.crt > "$CA_BUNDLE"
          if [ -s "$CA_CERT" ] && ! grep -Fqxf "$CA_CERT" "$CA_BUNDLE" 2>/dev/null; then
            cat "$CA_CERT" >> "$CA_BUNDLE"
          fi
          printf 'ca_certificate = %s\n' "$CA_BUNDLE" > "$WGET_RC"
          chmod 644 "$CA_BUNDLE" "$WGET_RC"
          [ -f "$CA_CERT" ] && chmod 644 "$CA_CERT"

          # 4. Configura il demone Docker della sandbox (daemon.json) per fidarsi della CA
          # e usare il proxy di sistema per ogni nuovo container avviato
           DOCKER_CONF="/etc/docker/daemon.json"
          mkdir -p /etc/docker
          if [ -f "$DOCKER_CONF" ]; then
            cp "$DOCKER_CONF" "${DOCKER_CONF}.bak"
            jq '. + {
              "proxies": {
                "default": {
                  "httpProxy": "'"$HTTP_PROXY"'",
                  "httpsProxy": "'"$HTTPS_PROXY"'",
                  "noProxy": "'"$NO_PROXY"'"
                }
              }
            }' "${DOCKER_CONF}.bak" > "${DOCKER_CONF}.tmp" && mv "${DOCKER_CONF}.tmp" "$DOCKER_CONF"
          else
            cat << JSON > "$DOCKER_CONF"
          {
            "proxies": {
              "default": {
                "httpProxy": "$HTTP_PROXY",
                "httpsProxy": "$HTTPS_PROXY",
                "noProxy": "$NO_PROXY"
              }
            }
          }
          JSON
          fi

          # Iniettiamo la CA del proxy direttamente nel trust store del demone Docker
          # (supportato da versioni recenti di dockerd per verificare i registry)
          mkdir -p /etc/docker/certs.d
          # Se vuoi che si fidi di tutti i registry intercettati dal proxy:
          cat "$CA_CERT" >> /etc/ssl/certs/ca-certificates.crt 2>/dev/null || true
          if command -v update-ca-certificates >/dev/null 2>&1; then
            update-ca-certificates || true
          fi

          # Riavvia il demone Docker per applicare le nuove configurazioni
          if command -v systemctl >/dev/null 2>&1; then
            systemctl restart docker || true
          elif [ -S /var/run/docker.sock ]; then
            pkill -x dockerd || true
            sleep 2
            dockerd-entrypoint.sh >/dev/null 2>&1 &
            sleep 3
          fi

          # 5. Installa il wrapper 'docker' definitivo per intercettare build e run
          if [ -x /usr/bin/docker ]; then
            REAL_DOCKER_BIN="/usr/bin/docker"
          elif [ -x /usr/local/bin/docker.real ]; then
            REAL_DOCKER_BIN="/usr/local/bin/docker.real"
          elif [ -x /usr/local/bin/docker ]; then
            mv /usr/local/bin/docker /usr/local/bin/docker.real
            REAL_DOCKER_BIN="/usr/local/bin/docker.real"
          fi

          if [ -n "$REAL_DOCKER_BIN" ]; then
            cat << 'EOF' > /usr/local/bin/docker
          #!/usr/bin/env bash
          set -e

          REAL_DOCKER="__REAL_DOCKER__"
          CA_BUNDLE="/etc/ssl/certs/sbx-ca-bundle.crt"
          WGET_RC="/etc/ssl/certs/sbx-wgetrc"

          if [ ! -s "$CA_BUNDLE" ]; then
            exec "$REAL_DOCKER" "$@"
          fi

          if [ "$1" = "run" ]; then
            shift
            exec "$REAL_DOCKER" run \
              -v "$CA_BUNDLE:$CA_BUNDLE:ro" \
              -v "$WGET_RC:$WGET_RC:ro" \
              -e "WGETRC=$WGET_RC" \
              -e "SSL_CERT_FILE=$CA_BUNDLE" \
              -e "CURL_CA_BUNDLE=$CA_BUNDLE" \
              -e "REQUESTS_CA_BUNDLE=$CA_BUNDLE" \
              -e "PIP_CERT=$CA_BUNDLE" \
              -e "GIT_SSL_CAINFO=$CA_BUNDLE" \
              -e "CARGO_HTTP_CAINFO=$CA_BUNDLE" \
              -e "NODE_EXTRA_CA_CERTS=$CA_BUNDLE" \
              -e "NPM_CONFIG_CAFILE=$CA_BUNDLE" \
              -e "DENO_CERT=$CA_BUNDLE" \
              "$@"
          fi

          SUBCMD=""
          if [ "$1" = "build" ]; then
            SUBCMD="build"
            shift
          elif [ "$1" = "buildx" ] && [ "$2" = "build" ]; then
            SUBCMD="buildx build"
            shift 2
          fi

          if [ -n "$SUBCMD" ]; then
            ORIG_DF=""
            ARGS=()
            CTX_DIR="."
            while [ $# -gt 0 ]; do
              case "$1" in
                -f|--file)
                  ORIG_DF="$2"
                  shift 2
                  ;;
                --file=*)
                  ORIG_DF="${1#*=}"
                  shift
                  ;;
                -*)
                  ARGS+=("$1")
                  shift
                  ;;
                *)
                  ARGS+=("$1")
                  [ -d "$1" ] && CTX_DIR="$1"
                  shift
                  ;;
              esac
            done

            STDIN_DF=""
            if [ "$ORIG_DF" = "-" ]; then
              STDIN_DF=$(mktemp /tmp/sbx-stdin-df.XXXXXX)
              cat > "$STDIN_DF"
              ORIG_DF="$STDIN_DF"
            elif [ -z "$ORIG_DF" ]; then
              if [ -f "$CTX_DIR/Dockerfile" ]; then
                ORIG_DF="$CTX_DIR/Dockerfile"
              elif [ -f "$CTX_DIR/dockerfile" ]; then
                ORIG_DF="$CTX_DIR/dockerfile"
              fi
            fi

            if [ -n "$ORIG_DF" ] && [ -f "$ORIG_DF" ]; then
              TMP_DF=$(mktemp /tmp/sbx-dockerfile.XXXXXX)
              trap 'rm -f "$TMP_DF" "$STDIN_DF"' EXIT
              awk '
                { print }
                /^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+/ {
                  img = ""
                  for (i = 2; i <= NF; i++) {
                    if ($i !~ /^--/) { img = tolower($i); break }
                  }
                  if (img != "scratch") {
                    print "COPY --from=sbx_ca sbx-proxy-ca.crt /usr/local/share/ca-certificates/sbx-proxy-ca.crt"
                    print "COPY --from=sbx_ca sbx-ca-bundle.crt sbx-wgetrc /etc/ssl/certs/"
                    print "ENV WGETRC=/etc/ssl/certs/sbx-wgetrc SSL_CERT_FILE=/etc/ssl/certs/sbx-ca-bundle.crt CURL_CA_BUNDLE=/etc/ssl/certs/sbx-ca-bundle.crt REQUESTS_CA_BUNDLE=/etc/ssl/certs/sbx-ca-bundle.crt PIP_CERT=/etc/ssl/certs/sbx-ca-bundle.crt GIT_SSL_CAINFO=/etc/ssl/certs/sbx-ca-bundle.crt CARGO_HTTP_CAINFO=/etc/ssl/certs/sbx-ca-bundle.crt NODE_EXTRA_CA_CERTS=/etc/ssl/certs/sbx-ca-bundle.crt NPM_CONFIG_CAFILE=/etc/ssl/certs/sbx-ca-bundle.crt DENO_CERT=/etc/ssl/certs/sbx-ca-bundle.crt"
                    print "RUN if [ \"$(id -u)\" = \"0\" ]; then if command -v update-ca-certificates >/dev/null 2>&1; then update-ca-certificates >/dev/null 2>&1; elif command -v update-ca-trust >/dev/null 2>&1; then mkdir -p /etc/pki/ca-trust/source/anchors && cp /usr/local/share/ca-certificates/sbx-proxy-ca.crt /etc/pki/ca-trust/source/anchors/ && update-ca-trust >/dev/null 2>&1; fi; if command -v keytool >/dev/null 2>&1; then keytool -importcert -noprompt -trustcacerts -alias sbx-proxy-ca -file /usr/local/share/ca-certificates/sbx-proxy-ca.crt -cacerts -storepass changeit >/dev/null 2>&1 || true; fi; fi"
                  }
                }
              ' "$ORIG_DF" > "$TMP_DF"

              "$REAL_DOCKER" $SUBCMD --build-context sbx_ca=/etc/ssl/certs -f "$TMP_DF" "${ARGS[@]}"
              exit $?
            fi
          fi

          exec "$REAL_DOCKER" "$@"
          EOF
            sed -i "s|__REAL_DOCKER__|$REAL_DOCKER_BIN|g" /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
          fi
      user: "0"
      description: Configure proxy and proxy CA for Docker-in-Sandbox and sudo
