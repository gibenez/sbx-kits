schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI

args:
  llmapi_domain:
    required: true
    description: "LLM service API domain"

sandbox:
  image: docker.io/sbx/pi-image:latest
  entrypoint:
    - bash
# agentInstructions:
#   filename: AGENTS.md
permissions:
  network:
    allow:
      - "${{ kit.args.llmapi_domain }}"
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org
      # Mirror APT necessari durante setup.install per openssh-server
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - deb.debian.org
ports:
  - container: 22
    protocol: tcp
    name: ssh
credentials:
  - service: llmapi
    apiKey:
      name: LLMAPI_API_KEY
      proxyManaged: true
      inject:
        # pi only sends x-api-key to api.anthropic.com; no other host needs
        # the key, so no other host gets it.
        - domain: "${{ kit.args.llmapi_domain }}"
          header: Authorization
          format: 'Bearer %s'
setup:
  install:
    # dev tools and skills
    - command: npx -y skills@latest add mattpocock/skills -g -y $(curl -s https://raw.githubusercontent.com/mattpocock/skills/main/.claude-plugin/plugin.json | jq -r '.skills[] | split("/") | last' | xargs -n1 printf -- '-s %s ')
      user: "1000"
      description: Install Matt Pocock Skills
    - command: npx -y skills@latest add https://github.com/only-cli/oc -g -y --skill web-browsing-cli
      user: "1000"
      description: Install OnlyCli Skill
    - command: npm install -g @playwright/cli@latest
      user: "1000"
      description: Install Playwright
    - command: playwright-cli install --skills agents --global
      user: "1000"
      description: Install Playwright Skills
    # ssh server
    - command: |
        DEBIAN_FRONTEND=noninteractive apt-get update -o DPkg::Lock::Timeout=120 && \
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server && \
        mkdir -p /run/sshd /etc/ssh/sshd_config.d && \
        ssh-keygen -A && \
        printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\nPermitRootLogin no\n' > /etc/ssh/sshd_config.d/99-password-auth.conf && \
        echo 'agent:12345' | chpasswd
      user: "0"
      description: Install and configure OpenSSH server
  startup:
  - command:
      - bash
      - -c
      - |
        mkdir -p /run/sshd && (pgrep -x sshd >/dev/null || /usr/sbin/sshd)
        VARS_REGEX='^(HTTP_PROXY|HTTPS_PROXY|NO_PROXY|http_proxy|https_proxy|no_proxy|SSL_CERT_FILE|NODE_EXTRA_CA_CERTS|NODE_USE_ENV_PROXY|PROXY_CA_CERT_B64|LLMAPI_API_KEY)='
        grep -vE "$VARS_REGEX" /etc/environment 2>/dev/null > /etc/environment.tmp || true
        : > /etc/profile.d/sbx-env.sh
        (env; tr '\0' '\n' < /proc/1/environ 2>/dev/null) \
          | grep -E "$VARS_REGEX" \
          | awk -F= '!seen[$1]++' \
          | while IFS='=' read -r k v; do
              printf '%s="%s"\n' "$k" "$v" >> /etc/environment.tmp
              printf 'export %s="%s"\n' "$k" "$v" >> /etc/profile.d/sbx-env.sh
            done
        mv -f /etc/environment.tmp /etc/environment
        chmod 644 /etc/environment /etc/profile.d/sbx-env.sh

        # 1. Preserve proxy/CA vars even with sudo
        echo 'Defaults env_keep += "HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy SSL_CERT_FILE NODE_EXTRA_CA_CERTS NODE_USE_ENV_PROXY"' > /etc/sudoers.d/sbx-proxy
        chmod 440 /etc/sudoers.d/sbx-proxy

        # 2. Inject HTTP_PROXY/HTTPS_PROXY in docker build (BuildKit) and docker run
        set -a && . /etc/environment && set +a
          if [ -n "$PROXY_CA_CERT_B64" ]; then
            printf '%s' "$PROXY_CA_CERT_B64" | base64 -d > /etc/ssl/certs/sbx-proxy-ca.crt
            chmod 644 /etc/ssl/certs/sbx-proxy-ca.crt
          fi
          for d in /home/agent/.docker /root/.docker; do
            mkdir -p "$d"
            [ -f "$d/config.json" ] || echo '{}' > "$d/config.json"
            jq --arg hp "$HTTP_PROXY" --arg hsp "$HTTPS_PROXY" --arg np "$NO_PROXY" \
              '.proxies.default = {httpProxy: $hp, httpsProxy: $hsp, noProxy: $np}' \
              "$d/config.json" > "$d/config.json.tmp" && mv "$d/config.json.tmp" "$d/config.json"
          done
          chown -R 1000:1000 /home/agent/.docker

          # 3. Transparent wrapper on docker for auto CA injecting in build and run
          cat << 'EOF' > /usr/local/bin/docker
          #!/usr/bin/env bash
          set -e

          REAL_DOCKER="/usr/bin/docker"
          CA_CERT="/etc/ssl/certs/sbx-proxy-ca.crt"

          if [ ! -f "$CA_CERT" ]; then
            exec "$REAL_DOCKER" "$@"
          fi

          if [ "$1" = "run" ]; then
            shift
            exec "$REAL_DOCKER" run \
              -v "$CA_CERT:$CA_CERT:ro" \
              -e "SSL_CERT_FILE=$CA_CERT" \
              -e "NODE_EXTRA_CA_CERTS=$CA_CERT" \
              -e "REQUESTS_CA_BUNDLE=$CA_CERT" \
              -e "CURL_CA_BUNDLE=$CA_CERT" \
              -e "PIP_CERT=$CA_CERT" \
              -e "GIT_SSL_CAINFO=$CA_CERT" \
              -e "NPM_CONFIG_CAFILE=$CA_CERT" \
              "$@"
          fi

          SUBCMD=""
          if [ "$1" = "build" ]; then
            SUBCMD="build"
            shift
          elif [ "$1" = "buildx" ] && [ "$2" = "build" ]; then
            SUBCMD="buildx build"
            shift 2
          fi

          if [ -n "$SUBCMD" ]; then
            ORIG_DF=""
            ARGS=()
            CTX_DIR="."
            while [ $# -gt 0 ]; do
              case "$1" in
                -f|--file)
                  ORIG_DF="$2"
                  shift 2
                  ;;
                --file=*)
                  ORIG_DF="${1#*=}"
                  shift
                  ;;
                -*)
                  ARGS+=("$1")
                  shift
                  ;;
                *)
                  ARGS+=("$1")
                  [ -d "$1" ] && CTX_DIR="$1"
                  shift
                  ;;
              esac
            done

            if [ "$ORIG_DF" = "-" ]; then
              exec "$REAL_DOCKER" $SUBCMD -f - "${ARGS[@]}"
            fi

            if [ -z "$ORIG_DF" ]; then
              if [ -f "$CTX_DIR/Dockerfile" ]; then
                ORIG_DF="$CTX_DIR/Dockerfile"
              elif [ -f "$CTX_DIR/dockerfile" ]; then
                ORIG_DF="$CTX_DIR/dockerfile"
              fi
            fi

            if [ -n "$ORIG_DF" ] && [ -f "$ORIG_DF" ]; then
              TMP_DF=$(mktemp /tmp/sbx-dockerfile.XXXXXX)
              trap 'rm -f "$TMP_DF"' EXIT
              awk '
                { print }
                /^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+/ {
                  img = ""
                  for (i = 2; i <= NF; i++) {
                    if ($i !~ /^--/) { img = tolower($i); break }
                  }
                  if (img != "scratch") {
                    print "COPY --from=sbx_ca sbx-proxy-ca.crt /usr/local/share/ca-certificates/sbx-proxy-ca.crt"
                    print "ENV SSL_CERT_FILE=/usr/local/share/ca-certificates/sbx-proxy-ca.crt NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/sbx-proxy-ca.crt REQUESTS_CA_BUNDLE=/usr/local/share/ca-certificates/sbx-proxy-ca.crt CURL_CA_BUNDLE=/usr/local/share/ca-certificates/sbx-proxy-ca.crt"
                    print "RUN if [ \"$(id -u)\" = \"0\" ]; then if command -v update-ca-certificates >/dev/null 2>&1; then update-ca-certificates >/dev/null 2>&1; elif command -v update-ca-trust >/dev/null 2>&1; then cp /usr/local/share/ca-certificates/sbx-proxy-ca.crt /etc/pki/ca-trust/source/anchors/ && update-ca-trust >/dev/null 2>&1; fi; fi"
                  }
                }
              ' "$ORIG_DF" > "$TMP_DF"

              "$REAL_DOCKER" $SUBCMD --build-context sbx_ca=/etc/ssl/certs -f "$TMP_DF" "${ARGS[@]}"
              exit $?
            fi
          fi

          exec "$REAL_DOCKER" "$@"
          EOF
          chmod +x /usr/local/bin/docker
    user: "0"
    description: Start OpenSSH daemon and configure proxy for SSH, sudo, and Docker/BuildKit
