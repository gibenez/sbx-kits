schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI

args:
  llmapi_domain:
    required: true
    description: "LLM service API domain"

sandbox:
  image: docker.io/sbx/pi-image:latest
  entrypoint:
    - pi

permissions:
  network:
    allow:
      - "${{ kit.args.llmapi_domain }}"
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org

credentials:
  - service: llmapi
    apiKey:
      name: LLMAPI_API_KEY
      proxyManaged: true
      inject:
        # Inject the API key only on requests sent to the configured LLM API domain.
        - domain: "${{ kit.args.llmapi_domain }}"
          header: Authorization
          format: 'Bearer %s'

setup:
  install:
    # Dev tools and skills
    - command: npx -y skills@latest add mattpocock/skills -g -y $(curl -s https://raw.githubusercontent.com/mattpocock/skills/main/.claude-plugin/plugin.json | jq -r '.skills[] | split("/") | last' | xargs -n1 printf -- '-s %s ')
      user: "1000"
      description: Install Matt Pocock Skills
    - command: npx -y skills@latest add https://github.com/only-cli/oc -g -y --skill web-browsing-cli
      user: "1000"
      description: Install OnlyCli Skill
    - command: npm install -g @playwright/cli@latest
      user: "1000"
      description: Install Playwright
    - command: playwright-cli install --skills agents --global
      user: "1000"
      description: Install Playwright Skills

  startup:
    - command:
        - bash
        - -c
        - |
          set -euo pipefail

          # Load proxy and CA variables from the current environment or PID 1.
          while IFS='=' read -r k v; do
            case "$k" in
              HTTP_PROXY|HTTPS_PROXY|NO_PROXY|PROXY_CA_CERT_B64) export "$k=$v" ;;
            esac
          done < <(env; tr '\0' '\n' < /proc/1/environ 2>/dev/null)

          # Preserve proxy and CA environment variables across sudo.
          echo 'Defaults env_keep += "HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy SSL_CERT_FILE NODE_EXTRA_CA_CERTS NODE_USE_ENV_PROXY"' > /etc/sudoers.d/sbx-proxy
          chmod 440 /etc/sudoers.d/sbx-proxy

          # Standard Docker client defaults. Preserve unrelated settings and
          # refuse conflicting custom proxy configuration instead of overwriting it.
          HTTP_PROXY=${HTTP_PROXY:-${http_proxy:-}}
          HTTPS_PROXY=${HTTPS_PROXY:-${https_proxy:-$HTTP_PROXY}}
          NO_PROXY=${NO_PROXY:-${no_proxy:-}}
          export HTTP_PROXY HTTPS_PROXY NO_PROXY
          if [ -z "$HTTP_PROXY" ] || [ -z "$HTTPS_PROXY" ]; then
            echo 'sbx-proxy: the sandbox forward proxy environment is unavailable' >&2
            exit 1
          fi
          for d in /home/agent/.docker /root/.docker; do
            [ ! -L "$d" ] && [ ! -L "$d/config.json" ] || {
              echo 'sbx-proxy: Docker client configuration symlink preserved; integrate explicitly' >&2; exit 1;
            }
            mkdir -p "$d"
            [ -f "$d/config.json" ] || printf '{}\n' > "$d/config.json"
            if ! jq -e --arg hp "$HTTP_PROXY" --arg hsp "$HTTPS_PROXY" --arg np "$NO_PROXY" \
              '(.proxies.default // {}) as $p | (($p.httpProxy // $hp) == $hp and ($p.httpsProxy // $hsp) == $hsp and ($p.noProxy // $np) == $np)' \
              "$d/config.json" >/dev/null 2>&1; then
              echo 'sbx-proxy: conflicting Docker client proxy settings preserved; merge explicitly' >&2
              exit 1
            fi
            tmp=$(mktemp "$d/.sbx-client.XXXXXX")
            jq --arg hp "$HTTP_PROXY" --arg hsp "$HTTPS_PROXY" --arg np "$NO_PROXY" \
              '.proxies.default = ((.proxies.default // {}) + {httpProxy: $hp, httpsProxy: $hsp, noProxy: $np})' \
              "$d/config.json" > "$tmp"
            chmod 600 "$tmp"
            mv "$tmp" "$d/config.json"
          done
          chown 1000:1000 /home/agent/.docker /home/agent/.docker/config.json

          # Extract the sandbox proxy CA and create a combined CA bundle.
          CA_CERT="/etc/ssl/certs/sbx-proxy-ca.crt"
          CA_BUNDLE="/etc/ssl/certs/sbx-ca-bundle.crt"
          WGET_RC="/etc/ssl/certs/sbx-wgetrc"

          for path in "$CA_BUNDLE" "$WGET_RC"; do
            [ ! -L "$path" ] || { echo 'sbx-proxy: existing trust-config symlink preserved; integrate explicitly' >&2; exit 1; }
          done
          rm -f "$CA_CERT"
          if [ -n "${PROXY_CA_CERT_B64:-}" ]; then
            printf '%s' "$PROXY_CA_CERT_B64" | base64 -d > "$CA_CERT" 2>/dev/null || true
          fi
          if [ ! -s "$CA_CERT" ] && compgen -G "/usr/local/share/ca-certificates/*.crt" > /dev/null; then
            cat /usr/local/share/ca-certificates/*.crt > "$CA_CERT"
          fi
          if [ ! -s "$CA_CERT" ] && [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            python3 -c '
          import re, subprocess
          data = open("/etc/ssl/certs/ca-certificates.crt").read()
          for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", data, re.S):
              out = subprocess.run(["openssl", "x509", "-noout", "-subject"], input=pem, text=True, capture_output=True).stdout
              if "Docker Sandboxes" in out:
                  open("/etc/ssl/certs/sbx-proxy-ca.crt", "w").write(pem + "\n")
                  break
          ' 2>/dev/null || true
          fi

          if [ ! -s "$CA_CERT" ]; then
            echo 'sbx: sandbox proxy CA is unavailable; cannot configure verified Docker access' >&2
            exit 1
          fi

          openssl x509 -in "$CA_CERT" -noout >/dev/null 2>&1 || {
            echo 'sbx-proxy: sandbox proxy certificate is invalid' >&2; exit 1;
          }
          cat /etc/ssl/certs/ca-certificates.crt > "$CA_BUNDLE"
          cat "$CA_CERT" >> "$CA_BUNDLE"
          printf 'ca_certificate = %s\n' "$CA_BUNDLE" > "$WGET_RC"
          chmod 644 "$CA_CERT" "$CA_BUNDLE" "$WGET_RC"

          # Shared assets are generated inside the sandbox, never sourced from the
          # workspace at runtime. No global host policy or upstream-proxy changes.
          ASSETS=/etc/ssl/certs/sbx-proxy
          [ ! -L "$ASSETS" ] || { echo 'sbx-proxy: asset-directory symlink refused' >&2; exit 1; }
          mkdir -p "$ASSETS"
          for name in proxy-ca.crt ca-bundle.crt wgetrc exec.sh docker.py; do
            [ ! -L "$ASSETS/$name" ] || { echo 'sbx-proxy: asset symlink refused' >&2; exit 1; }
          done
          cp "$CA_CERT" "$ASSETS/proxy-ca.crt"
          cp "$CA_BUNDLE" "$ASSETS/ca-bundle.crt"
          printf 'ca_certificate = /opt/sbx-proxy/ca-bundle.crt\n' > "$ASSETS/wgetrc"
          cat << 'SBX_EXEC' > "$ASSETS/exec.sh"
          #!/bin/sh
          # Sandbox-only adapter. External HTTP must still pass host GET/HEAD enforcement.
          set -eu
          mode=${1:-}; shift || true
          [ "$mode" = --build ] || [ "$mode" = --runtime ] || [ "$mode" = --exec ] || { echo 'sbx-proxy: invalid launch mode' >&2; exit 1; }
          [ "${1:-}" = -- ] && shift
          [ "$#" -gt 0 ] || { echo 'sbx-proxy: no command to launch' >&2; exit 1; }
          assets=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          fail() { echo "sbx-proxy: $*" >&2; exit 1; }
          work=''; settings_created=''; settings_record=''; settings_tmp=''; settings_lock=''; os_tmp=''
          cleanup() {
            if [ -n "$settings_created" ]; then rm -f "$settings_created"; fi
            if [ -n "$settings_record" ]; then rm -f "$settings_record"; fi
            if [ -n "$settings_tmp" ]; then rm -f "$settings_tmp"; fi
            if [ -n "$os_tmp" ]; then rm -f "$os_tmp"; fi
            if [ -n "$settings_lock" ]; then rmdir "$settings_lock"; fi
            if [ -n "$work" ]; then rm -rf "$work"; fi
          }
          trap cleanup EXIT
          ensure_work() {
            [ -n "$work" ] || work=$(mktemp -d /tmp/sbx-proxy.XXXXXX) || fail 'a writable /tmp is required by the trust adapter'
          }

          # Extend image/operator CA bundles in private temporary copies. Never replace
          # the originals or discard their private roots. Java clones its own store below.
          : "${SSL_CERT_FILE:=$assets/ca-bundle.crt}"
          : "${CURL_CA_BUNDLE:=$SSL_CERT_FILE}"
          : "${REQUESTS_CA_BUNDLE:=$SSL_CERT_FILE}"
          : "${PIP_CERT:=$SSL_CERT_FILE}"
          : "${GIT_SSL_CAINFO:=$SSL_CERT_FILE}"
          : "${CARGO_HTTP_CAINFO:=$SSL_CERT_FILE}"
          : "${NODE_EXTRA_CA_CERTS:=$assets/proxy-ca.crt}"
          : "${NPM_CONFIG_CAFILE:=$SSL_CERT_FILE}"
          : "${DENO_CERT:=$SSL_CERT_FILE}"
          : "${WGETRC:=$assets/wgetrc}"
          extend_bundle() {
            case "$1" in "$assets/ca-bundle.crt"|"$assets/proxy-ca.crt") printf '%s' "$1"; return ;; esac
            [ -f "$1" ] && [ -r "$1" ] || fail 'configured CA file is not readable; explicit trust integration required'
            cat "$1" "$assets/proxy-ca.crt" >"$work/$2.crt"
            printf '%s' "$work/$2.crt"
          }
          # Default bundles are mounted read-only and need no temporary copies.
          # Allocate in the parent shell only when a custom bundle needs extending;
          # allocation inside extend_bundle's command substitution would leak it.
          for bundle in "$SSL_CERT_FILE" "$CURL_CA_BUNDLE" "$REQUESTS_CA_BUNDLE" "$PIP_CERT" "$GIT_SSL_CAINFO" "$CARGO_HTTP_CAINFO" "$NODE_EXTRA_CA_CERTS" "$NPM_CONFIG_CAFILE" "$DENO_CERT"; do
            case "$bundle" in "$assets/ca-bundle.crt"|"$assets/proxy-ca.crt") ;; *) ensure_work ;; esac
          done
          SSL_CERT_FILE=$(extend_bundle "$SSL_CERT_FILE" ssl)
          CURL_CA_BUNDLE=$(extend_bundle "$CURL_CA_BUNDLE" curl)
          REQUESTS_CA_BUNDLE=$(extend_bundle "$REQUESTS_CA_BUNDLE" requests)
          PIP_CERT=$(extend_bundle "$PIP_CERT" pip)
          GIT_SSL_CAINFO=$(extend_bundle "$GIT_SSL_CAINFO" git)
          CARGO_HTTP_CAINFO=$(extend_bundle "$CARGO_HTTP_CAINFO" cargo)
          NODE_EXTRA_CA_CERTS=$(extend_bundle "$NODE_EXTRA_CA_CERTS" node)
          NPM_CONFIG_CAFILE=$(extend_bundle "$NPM_CONFIG_CAFILE" npm)
          DENO_CERT=$(extend_bundle "$DENO_CERT" deno)
          export SSL_CERT_FILE CURL_CA_BUNDLE REQUESTS_CA_BUNDLE PIP_CERT GIT_SSL_CAINFO CARGO_HTTP_CAINFO NODE_EXTRA_CA_CERTS NPM_CONFIG_CAFILE DENO_CERT WGETRC

          # Docker resolves env-files; do not read their contents in the host wrapper.
          # A CLI -e override identifies which spelling has explicit precedence. Opaque
          # env-file conflicts are reported instead of being silently overwritten.
          explicit=",${SBX_PROXY_EXPLICIT:-},"
          case "$explicit" in
            *,HTTP_PROXY,*) [ -n "${HTTP_PROXY:-}" ] || fail 'empty HTTP proxy override is unsupported'; http_proxy=$HTTP_PROXY ;;
            *,http_proxy,*) [ -n "${http_proxy:-}" ] || fail 'empty HTTP proxy override is unsupported'; HTTP_PROXY=$http_proxy ;;
          esac
          case "$explicit" in
            *,HTTPS_PROXY,*) [ -n "${HTTPS_PROXY:-}" ] || fail 'empty HTTPS proxy override is unsupported'; https_proxy=$HTTPS_PROXY ;;
            *,https_proxy,*) [ -n "${https_proxy:-}" ] || fail 'empty HTTPS proxy override is unsupported'; HTTPS_PROXY=$https_proxy ;;
          esac
          http=${HTTP_PROXY:-${http_proxy:-${SBX_HTTP_PROXY:-${HTTPS_PROXY:-${https_proxy:-}}}}}
          https=${HTTPS_PROXY:-${https_proxy:-${SBX_HTTPS_PROXY:-$http}}}
          [ -z "${http_proxy:-}" ] || [ -z "${HTTP_PROXY:-}" ] || [ "$http_proxy" = "$HTTP_PROXY" ] || fail 'conflicting HTTP proxy spellings'
          [ -z "${https_proxy:-}" ] || [ -z "${HTTPS_PROXY:-}" ] || [ "$https_proxy" = "$HTTPS_PROXY" ] || fail 'conflicting HTTPS proxy spellings'
          HTTP_PROXY=$http; http_proxy=$http; HTTPS_PROXY=$https; https_proxy=$https
          export HTTP_PROXY http_proxy HTTPS_PROXY https_proxy
          [ -n "$http$https" ] || fail 'no sandbox forward proxy configured'
          case "$explicit" in
            *,NO_PROXY,*) no_proxy=${NO_PROXY:-} ;;
            *,no_proxy,*) NO_PROXY=${no_proxy:-} ;;
            *)
              values="${NO_PROXY:-${SBX_NO_PROXY:-}},${no_proxy:-},${SBX_DOCKER_PEERS:-}"
              merged=''
              set -f
              old_ifs=$IFS; IFS=,
              for value in $values; do
                value=$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                [ -n "$value" ] || continue
                case ",$merged," in *",$value,"*) ;; *) merged=${merged:+$merged,}$value ;; esac
              done
              IFS=$old_ifs
              NO_PROXY=$merged; no_proxy=$merged ;;
          esac
          export NO_PROXY no_proxy

          parse_proxy() {
            case "$1" in http://*) authority=${1#http://} ;; *) fail 'only unauthenticated http:// forward proxy URLs are supported' ;; esac
            authority=${authority%/}
            case "$authority" in *@*|*/*|*\?*|*\#*) fail 'authenticated/path/query proxy URLs require explicit integration' ;; esac
            proxy_host=${authority%:*}; proxy_port=${authority##*:}
            case "$proxy_host" in ''|*[!a-zA-Z0-9._-]*) fail 'unsupported forward proxy host' ;; esac
            case "$proxy_port" in ''|*[!0-9]*) fail 'forward proxy requires an explicit numeric port' ;; esac
            [ "$proxy_host" != "$proxy_port" ] && [ "$proxy_port" -ge 1 ] && [ "$proxy_port" -le 65535 ] || fail 'invalid forward proxy port'
          }
          parse_proxy "$http"; http_host=$proxy_host; http_port=$proxy_port
          parse_proxy "$https"; https_host=$proxy_host; https_port=$proxy_port

          # OS-store consumers (for example apt) need the CA as well. Never require a
          # writable rootfs: env-aware clients and the private Java store still work on
          # non-root/read-only containers. No package installation is attempted here.
          if [ "$(id -u)" = 0 ] && [ -w /usr/local/share/ca-certificates ] && [ -w /etc/ssl/certs ] && command -v update-ca-certificates >/dev/null 2>&1; then
            if ! cmp -s "$assets/proxy-ca.crt" /usr/local/share/ca-certificates/sbx-proxy-ca.crt; then
              if [ ! -L /usr/local/share/ca-certificates/sbx-proxy-ca.crt ] && os_tmp=$(mktemp /usr/local/share/ca-certificates/.sbx-proxy.XXXXXX 2>/dev/null); then
                cat "$assets/proxy-ca.crt" >"$os_tmp"
                chmod 644 "$os_tmp"
                mv "$os_tmp" /usr/local/share/ca-certificates/sbx-proxy-ca.crt; os_tmp=''
                if ! update-ca-certificates >/dev/null 2>&1; then
                  echo 'sbx-proxy: OS trust update unavailable; only CA-bundle/private-Java-store clients are supported here' >&2
                fi
              else
                os_tmp=''
                echo 'sbx-proxy: OS trust store is read-only/custom; using CA-bundle/private-Java-store adapters only' >&2
              fi
            fi
          fi

          # Use exact hosts and explicit suffix patterns. Unrepresentable CIDRs/ports
          # stay proxied, never widened to a subnet or wildcard bypass.
          nonproxy=''
          set -f
          saved_ifs=$IFS; IFS=,
          all_no_proxy="${NO_PROXY:-},${no_proxy:-}"
          for entry in $all_no_proxy; do
            entry=$(printf '%s' "$entry" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            case "$entry" in
              '') continue ;;
              ::1|'[::1]') converted='[::1]' ;;
              *[!a-zA-Z0-9.*_-]*) echo 'sbx-proxy: NO_PROXY entry cannot be represented by JVM/Maven; retaining proxy routing' >&2; continue ;;
              .*) converted="${entry#.}|*$entry" ;;
              *) converted=$entry ;;
            esac
            case "|$nonproxy|" in
              *"|$converted|"*) ;;
              *) nonproxy=${nonproxy:+$nonproxy|}$converted ;;
            esac
          done
          IFS=$saved_ifs

          if command -v java >/dev/null 2>&1; then
            # Arbitrary existing JVM proxy/trust options cannot safely be rewritten.
            # In particular, refuse legacy images carrying baked JBang proxy options.
            case "${JAVA_TOOL_OPTIONS:-} ${JDK_JAVA_OPTIONS:-} ${_JAVA_OPTIONS:-} ${JBANG_JAVA_OPTIONS:-} ${MAVEN_OPTS:-}" in
              *-Dhttp.proxy*|*-Dhttps.proxy*|*-Dhttp.nonProxyHosts*|*-Djava.net.useSystemProxies*|*-Djavax.net.ssl.trustStore*)
                fail 'existing JVM proxy/trust properties preserved; rebuild legacy images or integrate custom JVM settings explicitly' ;;
            esac
            command -v keytool >/dev/null 2>&1 || fail 'Java detected without keytool; provide a reviewed trust-store adapter'
            [ -n "${JAVA_HOME:-}" ] && [ -r "$JAVA_HOME/lib/security/cacerts" ] || fail 'Java requires JAVA_HOME with a readable default cacerts store'
            ensure_work
            cp -L "$JAVA_HOME/lib/security/cacerts" "$work/cacerts" || fail 'could not copy Java trust store'
            keytool -delete -alias sbx-proxy-ca -keystore "$work/cacerts" -storepass changeit >/dev/null 2>&1 || true
            keytool -importcert -noprompt -alias sbx-proxy-ca -file "$assets/proxy-ca.crt" -keystore "$work/cacerts" -storepass changeit >/dev/null 2>&1 || fail 'could not extend Java trust store (custom passwords require explicit integration)'
            JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dhttp.proxyHost=$http_host -Dhttp.proxyPort=$http_port -Dhttps.proxyHost=$https_host -Dhttps.proxyPort=$https_port -Dhttp.nonProxyHosts=$nonproxy -Djavax.net.ssl.trustStore=$work/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
            export JAVA_TOOL_OPTIONS
          fi

          # Offline compiler containers may contain JBang/Maven caches on a read-only
          # rootfs but never use Maven networking. Do not demand writable settings there.
          # Explicit SBX_PROXY_MAVEN=1 still requests setup (for embedded resolver/tools).
          maven_needed=0
          if [ "${SBX_PROXY_NETWORK_NONE:-0}" != 1 ]; then
            if command -v mvn >/dev/null 2>&1 || command -v jbang >/dev/null 2>&1 || [ -n "${JBANG_VERSION:-}" ]; then maven_needed=1; fi
          fi
          # Auto-detection of an installed Maven/JBang is not evidence this command
          # uses it. Read-only cached compiler/DB probes still need JVM trust/proxy
          # setup above, but cannot create HOME settings. Never mistake EROFS for
          # lock contention; explicit/direct Maven setup still fails closed.
          maven_required=${SBX_PROXY_MAVEN:-0}
          case "${1##*/}" in mvn|mvnDebug|mvnw|jbang) maven_required=1;; esac
          maven_unwritable() {
            if [ -e "$settings" ]; then
              [ -f "$record" ] && cmp -s "$settings" "$record" && cmp -s "$settings" "$work/settings.xml" || fail 'existing Maven settings preserved; explicit merge or an isolated Maven HOME is required'
            else
              [ ! -e "$record" ] || fail 'inconsistent Maven adapter record; explicit integration required'
              [ "$maven_required" != 1 ] || fail 'Maven setup requires writable HOME/.m2 or preprovisioned matching adapter settings'
              echo 'sbx-proxy: Maven auto-setup unavailable on unwritable HOME/.m2; cached/non-Maven commands only; dependency resolution requires writable HOME or reviewed settings' >&2
            fi
          }
          configure_maven() {
            ensure_work
            [ -n "${HOME:-}" ] || fail 'HOME is required for the Maven adapter'
            [ ! -L "$HOME/.m2" ] || fail 'Maven directory symlink preserved; explicit integration required'
            settings=$HOME/.m2/settings.xml
            record=$HOME/.m2/.sbx-proxy-settings
            for path in "$settings" "$record"; do
              [ ! -L "$path" ] || fail 'Maven settings symlink preserved; explicit integration required'
            done
            umask 077
            {
              printf '%s\n' '<!-- sbx-proxy: managed runtime settings; command-scoped during builds -->' '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"><proxies>'
              printf '<proxy><id>sbx-http</id><active>true</active><protocol>http</protocol><host>%s</host><port>%s</port><nonProxyHosts>%s</nonProxyHosts></proxy>\n' "$http_host" "$http_port" "$nonproxy"
              printf '<proxy><id>sbx-https</id><active>true</active><protocol>https</protocol><host>%s</host><port>%s</port><nonProxyHosts>%s</nonProxyHosts></proxy>\n' "$https_host" "$https_port" "$nonproxy"
              printf '%s\n' '</proxies></settings>'
            } >"$work/settings.xml"
            if ! mkdir -p "$HOME/.m2" 2>/dev/null; then maven_unwritable; return; fi
            lock_path=$HOME/.m2/.sbx-proxy-lock
            attempt=0
            while ! mkdir "$lock_path" 2>/dev/null; do
              if [ ! -e "$lock_path" ] && [ ! -L "$lock_path" ]; then
                # A competing creator may have just released the lock. Test an
                # exclusive sibling write before classifying HOME as unwritable.
                if settings_tmp=$(mktemp "$HOME/.m2/.sbx-settings.XXXXXX" 2>/dev/null); then
                  rm -f "$settings_tmp"; settings_tmp=''
                else
                  settings_tmp=''; maven_unwritable; return
                fi
              fi
              attempt=$((attempt + 1))
              [ "$attempt" -lt 50 ] || fail 'Maven setup lock remained busy; inspect the adapter lock explicitly'
              sleep 0.1
            done
            settings_lock=$lock_path
            if [ -e "$settings" ]; then
              # Shared dependency caches and restart are safe ONLY with our unedited,
              # byte-identical required policy. Never rewrite a live/shared configuration.
              [ -f "$record" ] && cmp -s "$settings" "$record" && cmp -s "$settings" "$work/settings.xml" || fail 'existing Maven settings preserved; explicit merge or an isolated Maven HOME is required'
            else
              [ ! -e "$record" ] || fail 'inconsistent Maven adapter record; explicit integration required'
              # The source must be on the SAME filesystem: HOME/.m2 is often a volume.
              settings_tmp=$(mktemp "$HOME/.m2/.sbx-settings.XXXXXX")
              cat "$work/settings.xml" >"$settings_tmp"
              ln "$settings_tmp" "$settings" 2>/dev/null || fail 'could not create Maven settings exclusively; existing configuration preserved'
              settings_created=$settings
              rm -f "$settings_tmp"; settings_tmp=''
              if [ "$mode" = --runtime ]; then
                (set -C; cat "$settings" >"$record") 2>/dev/null || fail 'Maven adapter record appeared concurrently; existing configuration preserved'
                settings_record=$record
              fi
            fi
            rmdir "$settings_lock"; settings_lock=''
          }
          if [ "$maven_needed" = 1 ] || [ "${SBX_PROXY_MAVEN:-0}" = 1 ]; then configure_maven; fi

          if [ "$mode" = --runtime ]; then
            # Runtime records permit restart/shared caches with an identical policy.
            # Files disappear with container/volume cleanup, never into build layers.
            trap - EXIT
            exec "$@"
          fi
          if [ "$mode" = --exec ]; then
            # Docker exec does not inherit PID 1's exported environment. Reapply adapters
            # just for this command, preserve stdin/exit status, and clean private files.
            # BusyBox ash redirects an async command's fd 0 before <&0.
            # Preserve input on a separate descriptor before starting the child.
            exec 3<&0
            "$@" <&3 3<&- & child=$!
            exec 3<&-
            trap 'kill -TERM "$child" 2>/dev/null || true; wait "$child" 2>/dev/null || true; exit 143' TERM
            trap 'kill -INT "$child" 2>/dev/null || true; wait "$child" 2>/dev/null || true; exit 130' INT
            set +e
            wait "$child"; result=$?
            exit "$result"
          fi
          # Build adapters are command-scoped: settings/trust options do not survive RUN.
          "$@"
          SBX_EXEC
          cat << 'SBX_DOCKER_PY' > "$ASSETS/docker.py"
          #!/usr/bin/env python3
          """Sandbox Docker adapter: one build/runtime policy, no host policy changes."""
          import json
          import os
          import re
          import shlex
          import subprocess
          import sys
          import tempfile
          import uuid
          from pathlib import Path

          ASSETS = Path(os.environ.get('SBX_PROXY_ROOT', '/etc/ssl/certs/sbx-proxy')).resolve()
          TARGET = '/opt/sbx-proxy'
          PROXY_KEYS = ('HTTP_PROXY', 'HTTPS_PROXY', 'NO_PROXY')


          def fail(message):
              raise ValueError('sbx-proxy: ' + message)


          def split_flags(args, values, flags, stop=True):
              """Known flags only; canonical flag=value tokens keep values from becoming flags."""
              options, positional = [], []
              i = 0
              while i < len(args):
                  arg = args[i]
                  if arg == '--':
                      return options, args[i + 1:]
                  if not arg.startswith('-') or arg == '-':
                      if stop:
                          return options, args[i:]
                      positional.append(arg)
                      i += 1
                      continue
                  key = arg.split('=', 1)[0]
                  if key in values:
                      if '=' in arg:
                          options.append(arg)
                      else:
                          if i + 1 == len(args):
                              fail('missing Docker option value')
                          options.append(arg + '=' + args[i + 1])
                          i += 1
                  elif key in flags:
                      options.append(arg)
                  elif len(arg) > 2 and arg[:2] in {'-e', '-v', '-p', '-t', '-f', '-u', '-w', '-h'} and arg[:2] in values:
                      options.append(arg[:2] + '=' + arg[2:])
                  elif arg in ('-it', '-ti') and '-i' in flags and '-t' in flags:
                      options.extend(['-i', '-t'])
                  else:
                      fail('unsupported Docker option; no arguments were reinterpreted')
                  i += 1
              return options, positional


          def option_values(options, names):
              found = []
              i = 0
              while i < len(options):
                  key, equal, value = options[i].partition('=')
                  if key in names:
                      if not equal:
                          i += 1
                          value = options[i]
                      found.append(value)
                  i += 1
              return found


          def proxy_environment(image_env, explicit, peers=(), encode_new=False):
              image_env = dict(image_env)
              result = dict(explicit)
              for upper in PROXY_KEYS[:2]:
                  lower = upper.lower()
                  for source in (explicit, image_env, os.environ):
                      present = [source[key] for key in (upper, lower) if key in source and source[key] is not None]
                      if present:
                          if any(value != present[0] for value in present):
                              fail('conflicting proxy spellings; explicit integration required')
                          value = escape_dollars(present[0]) if encode_new and source is not explicit else present[0]
                          result[upper] = result[lower] = value
                          break
              entries = []
              for source in (os.environ, image_env, explicit):
                  for key in ('NO_PROXY', 'no_proxy'):
                      for entry in str(source.get(key) or '').split(','):
                          entry = entry.strip()
                          if encode_new and source is not explicit:
                              entry = escape_dollars(entry)
                          if entry and entry not in entries:
                              entries.append(entry)
              for peer in sorted(set(peers)):
                  if re.fullmatch(r'[a-zA-Z0-9_][a-zA-Z0-9_.-]*', peer) and peer not in entries:
                      entries.append(peer)
              result['NO_PROXY'] = result['no_proxy'] = ','.join(entries)
              return result


          def peer_names(model, service):
              def nets(item):
                  return set() if item.get('network_mode') else set(item.get('networks') or {'default': None})
              names = set()
              for name, peer in model['services'].items():
                  shared = nets(service) & nets(peer)
                  if shared:
                      names.add(name)
                      for network in shared:
                          names.update(((peer.get('networks') or {}).get(network) or {}).get('aliases') or [])
              return names


          def image_config(real, image, pull=False):
              result = subprocess.run(real + ['image', 'inspect', image], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              if result.returncode and pull:
                  if subprocess.call(real + ['pull', '--quiet', image]):
                      fail('runtime image unavailable')
                  result = subprocess.run(real + ['image', 'inspect', image], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              if result.returncode:
                  return None
              return json.loads(result.stdout)[0]['Config']


          def require_shell(real, image):
              # Do not replace a distroless image's entrypoint and only discover the
              # missing shell after starting its intended workload. This isolated probe
              # runs no application command and is always removed by its exact name.
              name = 'sbx-proxy-check-' + uuid.uuid4().hex
              try:
                  result = subprocess.run(real + ['run', '--rm', '--name', name, '--network', 'none', '--entrypoint', '/bin/sh', image, '-c', ':'], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)
                  if result.returncode:
                      fail('runtime image requires an executable Linux /bin/sh; scratch/distroless or unsupported platforms need an explicit adapter')
              finally:
                  subprocess.run(real + ['rm', '-f', name], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)


          def image_environment(config):
              return dict(value.split('=', 1) for value in config.get('Env') or [] if '=' in value)


          def original_parts(config, entrypoint=None, command=None):
              # Compose's entrypoint override intentionally drops the image CMD unless a
              # command was supplied, matching the Compose specification.
              original_entry = config.get('Entrypoint') or [] if entrypoint is None else entrypoint
              if isinstance(original_entry, str):
                  original_entry = shlex.split(original_entry)
              original_cmd = (config.get('Cmd') or []) if command is None and entrypoint is None else (command or [])
              if isinstance(original_cmd, str):
                  original_cmd = shlex.split(original_cmd)
              if not original_entry and not original_cmd:
                  fail('image has no command; explicit command required')
              return list(original_entry), list(original_cmd)


          def original_command(config, entrypoint=None, command=None):
              entry, command = original_parts(config, entrypoint, command)
              return entry + command


          def remove_options(options, names):
              clean, i = [], 0
              while i < len(options):
                  key, equal, _ = options[i].partition('=')
                  if key in names:
                      i += 1 if equal else 2
                  else:
                      clean.append(options[i]); i += 1
              return clean


          def cli_environment(options):
              explicit = {}
              for value in option_values(options, {'-e', '--env'}):
                  key, equal, val = value.partition('=')
                  explicit[key] = val if equal else os.environ.get(key)
              return explicit


          def apply_proxy_overrides(environment, overrides):
              for upper in PROXY_KEYS:
                  values = [overrides[key] for key in (upper, upper.lower()) if key in overrides and overrides[key] is not None]
                  if values:
                      if any(value != values[0] for value in values):
                          fail('conflicting command-line proxy spellings')
                      environment[upper] = environment[upper.lower()] = values[0]
              return environment


          def inject_build(text):
              # Deliberately bounded Dockerfile parser. Unsupported syntax fails before a
              # build, rather than rewriting arbitrary Dockerfiles with regex substitutions.
              if re.search(r'(?im)^#\s*(escape|check)\s*=', text) or '<<' in text:
                  fail('Dockerfile escape/check directives or heredocs need explicit integration')
              instructions, pending = [], ''
              for line in text.splitlines():
                  if not pending and (not line.strip() or line.lstrip().startswith('#')):
                      instructions.append(line)
                      continue
                  if pending and (not line.strip() or line.lstrip().startswith('#')):
                      continue
                  pending += line + '\n'
                  if line.rstrip().endswith('\\'):
                      continue
                  instructions.append(pending.rstrip('\n'))
                  pending = ''
              if pending:
                  fail('unfinished Dockerfile continuation')
              out, shell, stages, scratch = [], ['/bin/sh', '-c'], 0, False
              for instruction in instructions:
                  logical = re.sub(r'\\\s*\n', ' ', instruction)
                  match = re.match(r'^\s*([A-Za-z]+)\s+(.*)$', logical, re.S)
                  if not match:
                      out.append(instruction)
                      continue
                  op, value = match[1].upper(), match[2]
                  if op == 'FROM':
                      stages += 1
                      shell = ['/bin/sh', '-c']
                      words = shlex.split(value)
                      if len(words) >= 3 and words[-2].upper() == 'AS' and words[-1].lower() == 'sbx_proxy':
                          fail('reserved sbx_proxy stage name already exists')
                      image = next((word for word in words if not word.startswith('--')), '')
                      scratch = image.lower() == 'scratch'
                      if scratch:
                          # A no-RUN scratch stage stays untouched. Runtime shell launch
                          # will explicitly report incompatibility, never claim support.
                          out.append(instruction)
                          continue
                      out.extend([instruction, f'COPY --from=sbx_proxy . {TARGET}/'])
                  elif op == 'SHELL':
                      shell = json.loads(value)
                      if not isinstance(shell, list) or not shell or not all(isinstance(x, str) for x in shell):
                          fail('unsupported Dockerfile SHELL')
                      out.append(instruction)
                  elif op == 'ONBUILD':
                      fail('ONBUILD triggers require explicit integration')
                  elif op == 'RUN':
                      if scratch:
                          fail('scratch stages cannot run the shell adapter')
                      if not stages:
                          fail('RUN before FROM')
                      flags = []
                      while value.startswith('--'):
                          flag, separator, value = value.partition(' ')
                          if not separator or not re.fullmatch(r'--(?:mount|network|security|device)=[^\s]+', flag):
                              fail('unsupported Dockerfile RUN option')
                          flags.append(flag)
                          value = value.lstrip()
                      if '--security=insecure' in flags or '--network=none' in flags:
                          # No egress needed for --network=none, but retain environment and
                          # trust setup; insecure mode is the caller's explicit choice.
                          pass
                      command = json.loads(value) if value.startswith('[') else shell + [value]
                      if not isinstance(command, list) or not command or not all(isinstance(x, str) for x in command):
                          fail('unsupported Dockerfile RUN command')
                      wrapped = ['/bin/sh', f'{TARGET}/exec.sh', '--build', '--'] + command
                      if '--network=none' in flags:
                          wrapped = ['env', 'SBX_PROXY_NETWORK_NONE=1'] + wrapped
                      out.append('RUN ' + (' '.join(flags) + ' ' if flags else '') + json.dumps(wrapped))
                  else:
                      out.append(instruction)
              if not stages:
                  fail('Dockerfile has no FROM')
              return '\n'.join(out) + '\n'


          def inject_model_builds(model):
              for service in model['services'].values():
                  build = service.get('build')
                  if not build:
                      continue
                  if isinstance(build, str):
                      build = {'context': build}
                      service['build'] = build
                  context = Path(build.get('context', '.'))
                  if not context.is_dir():
                      fail('only local build contexts are supported')
                  text = build.get('dockerfile_inline')
                  from_file = text is None
                  if from_file:
                      path = Path(build.get('dockerfile', 'Dockerfile'))
                      text = (path if path.is_absolute() else context / path).read_text()
                  contexts = build.get('additional_contexts') or {}
                  contexts = dict(x.split('=', 1) for x in contexts) if isinstance(contexts, list) else dict(contexts)
                  if 'sbx_proxy' in contexts:
                      fail('reserved sbx_proxy build context already exists')
                  contexts['sbx_proxy'] = escape_dollars(str(ASSETS))
                  build['additional_contexts'] = contexts
                  build.pop('dockerfile', None)
                  generated = inject_build(text)
                  # Compose's `config` output already escapes literal dollars. Only new
                  # file/image-derived strings need encoding, never the existing model.
                  build['dockerfile_inline'] = escape_dollars(generated) if from_file else generated
                  arguments = build.setdefault('args', {})
                  if isinstance(arguments, list):
                      arguments = dict(value.split('=', 1) if '=' in value else (value, None) for value in arguments)
                      build['args'] = arguments
                  for key in PROXY_KEYS:
                      if key in os.environ:
                          arguments.setdefault(key, escape_dollars(os.environ[key]))
                          arguments.setdefault(key.lower(), escape_dollars(os.environ[key]))


          def escape_dollars(value):
              if isinstance(value, str):
                  return value.replace('$', '$$')
              if isinstance(value, list):
                  return [escape_dollars(x) for x in value]
              if isinstance(value, dict):
                  return {k: escape_dollars(v) for k, v in value.items()}
              return value


          def write_model(path, model):
              path.write_text(json.dumps(model))
              path.chmod(0o600)


          RUN_VALUES = set('--add-host --annotation --attach -a --blkio-weight --blkio-weight-device --cap-add --cap-drop --cgroup-parent --cgroupns --cidfile --cpu-period --cpu-quota --cpu-rt-period --cpu-rt-runtime --cpu-shares -c --cpus --cpuset-cpus --cpuset-mems --device --device-cgroup-rule --device-read-bps --device-read-iops --device-write-bps --device-write-iops --dns --dns-option --dns-search --domainname --entrypoint --env -e --env-file --expose --gpus --group-add --health-cmd --health-interval --health-retries --health-start-interval --health-start-period --health-timeout --hostname -h --init-path --ip --ip6 --ipc --isolation --label -l --label-file --link --link-local-ip --log-driver --log-opt --mac-address --memory -m --memory-reservation --memory-swap --memory-swappiness --mount --name --network --net --network-alias --oom-score-adj --pid --pids-limit --platform --publish -p --pull --restart --runtime --security-opt --shm-size --stop-signal --stop-timeout --storage-opt --sysctl --tmpfs --ulimit --user -u --userns --uts --volume -v --volume-driver --volumes-from --workdir -w'.split())
          RUN_FLAGS = set('--detach -d --disable-content-trust --help --init --interactive -i --no-healthcheck --oom-kill-disable --privileged --publish-all -P --read-only --rm --sig-proxy --tty -t --use-api-socket'.split())
          BUILD_VALUES = set('--add-host --allow --annotation --attest --build-arg --build-context --builder --cache-from --cache-to --call --cgroup-parent --cpu-period --cpu-quota --cpu-shares -c --cpuset-cpus --cpuset-mems --file -f --iidfile --label --memory -m --memory-swap --metadata-file --network --no-cache-filter --output -o --platform --progress --provenance --sbom --secret --shm-size --ssh --tag -t --target --ulimit'.split())
          BUILD_FLAGS = set('--check --debug --disable-content-trust --help --load --no-cache --pull --push --quiet -q --rm --force-rm --squash'.split())
          COMPOSE_VALUES = set('--ansi --env-file -f --file --parallel --profile --progress --project-directory -p --project-name'.split())
          COMPOSE_FLAGS = {'--all-resources', '--compatibility', '--dry-run'}


          def docker_network_peers(real, options):
              names = set()
              networks = option_values(options, {'--network', '--net'})
              if not networks:
                  # The legacy default bridge has no automatic name resolution.
                  networks = ['bridge']
              for network in networks:
                  if network in {'bridge', 'host', 'none'} or network.startswith('container:'):
                      continue
                  if ',' in network or network.startswith('name='):
                      fail('extended Docker network syntax requires explicit integration')
                  result = subprocess.run(real + ['network', 'inspect', network], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  if result.returncode:
                      fail('requested Docker network is unavailable')
                  network_info = json.loads(result.stdout)[0]
                  network_name = network_info['Name']
                  for identity, peer in (network_info.get('Containers') or {}).items():
                      names.add(peer['Name'])
                      result = subprocess.run(real + ['inspect', '--format', '{{json .NetworkSettings.Networks}}', identity], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                      if result.returncode:
                          fail('Docker network changed during peer discovery; retry the command')
                      attached = json.loads(result.stdout).get(network_name) or {}
                      names.update(attached.get('Aliases') or [])
                      names.update(attached.get('DNSNames') or [])
              for link in option_values(options, {'--link'}):
                  target, _, alias = link.partition(':')
                  names.add(target)
                  if alias:
                      names.add(alias)
              names.update(option_values(options, {'--network-alias'}))
              return sorted(name for name in names if isinstance(name, str) and re.fullmatch(r'[a-zA-Z0-9_][a-zA-Z0-9_.-]*', name))


          def docker_run(real, args):
              options, tail = split_flags(args[1:], RUN_VALUES, RUN_FLAGS)
              if not tail:
                  fail('runtime image is required')
              image, supplied = tail[0], tail[1:]
              if option_values(options, {'--platform'}) or os.environ.get('DOCKER_DEFAULT_PLATFORM'):
                  fail('runtime platform overrides need an explicit adapter; only native-platform runtime images are tested')
              policy = (option_values(options, {'--pull'}) or ['missing'])[-1]
              if policy not in {'always', 'missing', 'never'}:
                  fail('unsupported runtime pull policy')
              for mount in option_values(options, {'-v', '--volume', '--mount'}):
                  if TARGET in mount:
                      fail('reserved adapter mount conflicts with an existing mount')
              if policy == 'always' and subprocess.call(real + ['pull', '--quiet', image]):
                  fail('runtime image pull failed')
              config = image_config(real, image, pull=policy != 'never')
              if config is None:
                  fail('runtime image unavailable under the requested pull policy')
              options = remove_options(options, {'--pull'})
              require_shell(real, image)
              overrides = option_values(options, {'--entrypoint'})
              entry = [overrides[-1]] if overrides and overrides[-1] else ([] if overrides else None)
              command = supplied if supplied else None
              # Docker --entrypoint also drops the default CMD.
              original = original_command(config, entry, command)
              explicit = cli_environment(options)
              apply_proxy_overrides({}, explicit)  # validate contradictory CLI spellings
              peers = docker_network_peers(real, options)
              # Let Docker resolve env-files itself. Inject only FALLBACK metadata, never
              # main proxy -e flags that would silently override an opaque env-file.
              metadata = {
                  'SBX_HTTP_PROXY': os.environ.get('HTTP_PROXY', os.environ.get('http_proxy', '')),
                  'SBX_HTTPS_PROXY': os.environ.get('HTTPS_PROXY', os.environ.get('https_proxy', '')),
                  'SBX_NO_PROXY': os.environ.get('NO_PROXY', os.environ.get('no_proxy', '')),
                  'SBX_DOCKER_PEERS': ','.join(peers),
                  'SBX_PROXY_EXPLICIT': ','.join(key for key in explicit if key.upper() in PROXY_KEYS),
                  'SBX_PROXY_NETWORK_NONE': '1' if 'none' in option_values(options, {'--network', '--net'}) else '0',
              }
              if set(explicit).intersection(metadata):
                  fail('reserved sandbox proxy environment metadata already exists')
              defaults = [item for key, value in metadata.items() for item in ('-e', key + '=' + value)]
              # Actual image, env-file and CLI environment is evaluated by exec.sh inside
              # the container. No private env-file is inspected by this adapter.
              return subprocess.call(real + [args[0]] + options + defaults + [
                  '--pull', 'never', '--mount', f'type=bind,src={ASSETS},dst={TARGET},readonly',
                  '--entrypoint', '/bin/sh', image, f'{TARGET}/exec.sh', '--runtime', '--',
              ] + original)


          def docker_build(real, args, buildx=False):
              options, tail = split_flags(args[2:] if buildx else args[1:], BUILD_VALUES, BUILD_FLAGS, stop=False)
              if len(tail) != 1 or not Path(tail[0]).is_dir():
                  fail('standalone builds require one local directory context')
              if any(value.split('=', 1)[0] == 'sbx_proxy' for value in option_values(options, {'--build-context'})):
                  fail('reserved sbx_proxy build context already exists')
              files = option_values(options, {'-f', '--file'})
              file = files[-1] if files else str(Path(tail[0]) / 'Dockerfile')
              text = sys.stdin.read() if file == '-' else Path(file).read_text()
              clean = remove_options(options, {'-f', '--file'})
              defaults = []
              for key in PROXY_KEYS:
                  if key in os.environ:
                      defaults += ['--build-arg', key + '=' + os.environ[key], '--build-arg', key.lower() + '=' + os.environ[key]]
              with tempfile.TemporaryDirectory(prefix='sbx-proxy-build-') as directory:
                  file = Path(directory) / 'Dockerfile'
                  file.write_text(inject_build(text))
                  file.chmod(0o600)
                  prefix = ['buildx', 'build'] if buildx else ['build']
                  return subprocess.call(real + prefix + defaults + clean + ['--build-context', f'sbx_proxy={ASSETS}', '-f', str(file), tail[0]])


          def selected_services(model, command, rest, global_options):
              values = {'--timeout', '-t', '--scale', '--exit-code-from', '--wait-timeout', '--attach', '--no-attach', '--pull'}
              flags = {'--abort-on-container-exit', '--abort-on-container-failure', '--always-recreate-deps', '--attach-dependencies', '--build', '--detach', '-d', '--force-recreate', '--menu', '--no-attach', '--no-build', '--no-color', '--no-deps', '--no-log-prefix', '--no-recreate', '--no-start', '--quiet-build', '--quiet-pull', '--remove-orphans', '--renew-anon-volumes', '-V', '--timestamps', '--wait', '--watch', '-w', '--yes', '-y'}
              if command == 'run':
                  _, tail = split_flags(rest, RUN_VALUES | {'--index'}, RUN_FLAGS | {'--build', '--no-deps', '--quiet-pull', '--remove-orphans', '--service-ports', '--use-aliases', '-T'})
                  if not tail:
                      fail('Compose run requires a service')
                  selected = {tail[0]}
              else:
                  _, tail = split_flags(rest, values, flags, stop=False)
                  profiles = set(option_values(global_options, {'--profile'})) | set(os.environ.get('COMPOSE_PROFILES', '').split(','))
                  selected = set(tail) if tail else {name for name, service in model['services'].items() if not service.get('profiles') or profiles.intersection(service['profiles']) or '*' in profiles}
              if not selected.issubset(model['services']):
                  fail('unknown Compose service')
              if '--no-deps' not in rest:
                  todo = list(selected)
                  while todo:
                      name = todo.pop()
                      for dependency in model['services'][name].get('depends_on') or {}:
                          if dependency not in selected:
                              selected.add(dependency); todo.append(dependency)
              return selected


          EXEC_VALUES = {'--detach-keys', '--env', '-e', '--env-file', '--user', '-u', '--workdir', '-w'}
          EXEC_FLAGS = {'--detach', '-d', '--interactive', '-i', '--privileged', '--tty', '-t'}


          def exec_metadata(real, identity, options):
              result = subprocess.run(real + ['inspect', identity], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              if result.returncode:
                  fail('exec requires an existing managed container')
              info = json.loads(result.stdout)[0]
              if not any(mount.get('Destination') == TARGET for mount in info.get('Mounts') or []):
                  fail('exec target is unmanaged; recreate it through the sandbox adapter first')
              env = image_environment(info['Config'])
              explicit = cli_environment(options)
              apply_proxy_overrides({}, explicit)
              keys = set(filter(None, env.get('SBX_PROXY_EXPLICIT', '').split(',')))
              for upper in PROXY_KEYS:
                  chosen = {key for key in explicit if key in (upper, upper.lower())}
                  if chosen:
                      keys -= {upper, upper.lower()}
                      keys |= chosen
              # Keep the creation-time routing snapshot. Rediscovering extra names here
              # would silently change a shared Maven policy while PID 1 is still using it.
              # Compose already stores its declared peer aliases in the container NO_PROXY.
              values = {'SBX_PROXY_EXPLICIT': ','.join(sorted(keys)), 'SBX_DOCKER_PEERS': env.get('SBX_DOCKER_PEERS', ''),
                        'SBX_PROXY_NETWORK_NONE': '1' if info.get('HostConfig', {}).get('NetworkMode') == 'none' else '0'}
              if set(explicit).intersection(values):
                  fail('reserved sandbox proxy exec metadata already exists')
              return [arg for key, value in values.items() for arg in ('-e', key + '=' + value)]


          def docker_exec(real, args):
              options, tail = split_flags(args[1:], EXEC_VALUES, EXEC_FLAGS)
              if len(tail) < 2:
                  fail('exec requires a container and command')
              metadata = exec_metadata(real, tail[0], options)
              return subprocess.call(real + ['exec'] + options + metadata + [tail[0], '/bin/sh', f'{TARGET}/exec.sh', '--exec', '--'] + tail[1:])


          def compose_exec(real, globals_, rest):
              options, tail = split_flags(rest, EXEC_VALUES | {'--index'}, EXEC_FLAGS | {'-T', '--no-TTY'})
              if len(tail) < 2:
                  fail('Compose exec requires a service and command')
              base = real + ['compose'] + globals_
              result = subprocess.run(base + ['ps', '-q', tail[0]], stdout=subprocess.PIPE)
              if result.returncode:
                  return result.returncode
              index = (option_values(options, {'--index'}) or ['1'])[-1]
              identity = None
              for candidate in result.stdout.decode().split():
                  label = subprocess.run(real + ['inspect', '--format', '{{index .Config.Labels "com.docker.compose.container-number"}}', candidate], stdout=subprocess.PIPE)
                  if label.returncode == 0 and label.stdout.decode().strip() == index:
                      identity = candidate
                      break
              if identity is None:
                  fail('Compose exec requires a running service instance')
              metadata = exec_metadata(real, identity, options)
              return subprocess.call(base + ['exec'] + options + metadata + [tail[0], '/bin/sh', f'{TARGET}/exec.sh', '--exec', '--'] + tail[1:])


          def docker_compose(real, args):
              globals_, tail = split_flags(args[1:], COMPOSE_VALUES, COMPOSE_FLAGS)
              dry_runs = [arg for arg in globals_ if arg == '--dry-run' or arg.startswith('--dry-run=')]
              if dry_runs and dry_runs[-1] not in {'--dry-run=false', '--dry-run=False', '--dry-run=FALSE', '--dry-run=0', '--dry-run=f', '--dry-run=F'}:
