schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI

args:
  llmapi_domain:
    required: true
    description: "LLM service API domain"

sandbox:
  image: docker.io/sbx/pi-image:latest
  entrypoint:
    - pi

permissions:
  network:
    allow:
      - "${{ kit.args.llmapi_domain }}"
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org

credentials:
  - service: llmapi
    apiKey:
      name: LLMAPI_API_KEY
      proxyManaged: true
      inject:
        # Inject the API key only on requests sent to the configured LLM API domain.
        - domain: "${{ kit.args.llmapi_domain }}"
          header: Authorization
          format: 'Bearer %s'

setup:
  install:
    # Kit v2 maps bundled assets into /home/agent. Install root-owned copies
    # so privileged startup never runs the agent-writable staged scripts.
    - command: >-
        install -d -o root -g root -m 755 /opt/pi-dev/startup &&
        install -o root -g root -m 644
        /home/agent/.pi/kit-assets/startup/configure-docker-proxy.sh
        /home/agent/.pi/kit-assets/startup/configure-docker-relay.sh
        /opt/pi-dev/startup/
      user: "0"
      description: Install root-owned Pi startup scripts

    - command: pi install npm:pi-subagents-lite
      user: "1000"
      description: Install Pi Subagents Lite

    # Dev tools and skills
    - command: npx -y skills@latest add mattpocock/skills -g -y $(curl -s https://raw.githubusercontent.com/mattpocock/skills/main/.claude-plugin/plugin.json | jq -r '.skills[] | split("/") | last' | xargs -n1 printf -- '-s %s ')
      user: "1000"
      description: Install Matt Pocock Skills
    - command: npx -y skills@latest add https://github.com/only-cli/oc -g -y --skill web-browsing-cli
      user: "1000"
      description: Install OnlyCli Skill
    # The upstream skill documents CLI installation; defer it until first use.
    - command: npx -y skills@latest add https://github.com/microsoft/playwright-cli -g -y --skill playwright-cli
      user: "1000"
      description: Install Playwright Skill

  startup:
    - command:
        - bash
        - /opt/pi-dev/startup/configure-docker-proxy.sh
      user: "0"
      description: Configure shared Docker build/runtime proxy, CA, JVM and Maven adapters; preserve HTTP policy

    # Keep the existing trust/runtime adapters. This separate network adapter
    # covers clients that ignore proxy environment variables (including Vite).
    # Scope: IPv4 HTTP(S), ports 80/443, docker0 and Docker br-* bridges.
    # Not host networking, arbitrary protocols, ECH, or universal runtime trust.
    - command:
        - bash
        - /opt/pi-dev/startup/configure-docker-relay.sh
      user: "0"
      description: Route Docker bridge HTTP(S) through mandatory inspection proxy using SNI-aware CONNECT relay
